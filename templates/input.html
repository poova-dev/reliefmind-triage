<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Describe the Emergency</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-6">
        <h2 class="text-2xl font-bold mb-4">What's happening?</h2>

        <form action="/result" method="post">
            <textarea name="symptom_text" rows="5" required
                class="w-full p-4 rounded-lg bg-gray-800 border border-gray-700 text-white mb-4"
                placeholder="Describe symptoms, age, what happened..."></textarea>

            <label class="flex items-center gap-3 mb-6 bg-gray-800 border border-gray-700 rounded-lg p-4 cursor-pointer">
                <input type="checkbox" name="disaster_mode" value="true"
                    class="w-5 h-5 accent-red-600">
                <span class="text-sm">
                    <span class="font-semibold">Disaster Situation</span><br>
                    <span class="text-gray-400">Flood, earthquake, or mass-casualty event</span>
                </span>
            </label>

            <button type="submit"
                class="w-full bg-red-600 hover:bg-red-700 font-bold py-4 rounded-lg text-lg">
                Analyze
            </button>
        </form>
    </div>
</body>
</html>
