<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Report symptoms or conditions for AI triage assessment.">
    <title>Describe the Emergency - ReliefMind Triage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
            overflow-x: hidden;
        }
        .heading-font {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.1;
            animation: float-blob 10s infinite alternate ease-in-out;
        }
        @keyframes float-blob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -40px) scale(1.2); }
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .chip {
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chip:hover {
            background: rgba(55, 65, 81, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        .chip.active {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center relative px-4 py-8">
    <div class="blob w-72 h-72 bg-red-600 top-1/4 left-1/4" style="animation-duration: 8s;"></div>
    <div class="blob w-80 h-80 bg-blue-600 bottom-1/4 right-1/4" style="animation-duration: 12s; animation-delay: 2s;"></div>

    <div class="glass-card w-full max-w-lg rounded-2xl p-6 md:p-8 relative z-10 mx-auto">
        <!-- Back Link -->
        <a href="/" class="inline-flex items-center gap-1.5 text-gray-400 hover:text-white transition-colors text-sm mb-6 font-medium group">
            <span class="material-symbols-outlined text-base transition-transform group-hover:-translate-x-1">arrow_back</span>
            Back to Home
        </a>

        <!-- One-Tap SOS Quick Action Banner -->
        <div class="mb-6 p-4 rounded-xl border border-red-500/20 bg-red-950/20 flex flex-col sm:flex-row items-center justify-between gap-4 text-left">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-red-500 animate-pulse text-3xl">emergency</span>
                <div>
                    <span class="font-bold text-red-400 block text-sm">🚨 Instant One-Tap SOS</span>
                    <span class="text-xs text-gray-400">Call 108 + Copy GPS coordinates</span>
                </div>
            </div>
            <button onclick="triggerOneTapSOS(event)"
                class="w-full sm:w-auto px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg flex items-center justify-center gap-1.5 transition-all shadow-md active:scale-95">
                <span class="material-symbols-outlined text-sm">call</span> CALL 108
            </button>
        </div>

        <!-- Notification Toast -->
        <div id="sos-toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl bg-emerald-950 border border-emerald-500/30 text-emerald-400 text-xs font-semibold shadow-lg shadow-black/50 items-center gap-2">
            <span class="material-symbols-outlined text-sm">content_copy</span>
            <span id="sos-toast-msg">GPS Coordinates copied to clipboard!</span>
        </div>

        <h2 class="text-2xl font-bold mb-2 heading-font">Describe the Emergency</h2>
        <p class="text-gray-400 text-sm mb-6 leading-relaxed">
            Select a quick symptom template below or type specific details directly to analyze severity.
        </p>

        <!-- Quick symptom template chips -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button type="button" onclick="fillTemplate('Patient is having trouble breathing, breathing is fast and labored.')"
                class="chip rounded-xl p-3.5 flex flex-col items-center gap-2 text-center">
                <span class="material-symbols-outlined text-blue-400 text-3xl">air</span>
                <span class="text-xs font-semibold text-gray-200">Breathing trouble</span>
            </button>
            <button type="button" onclick="fillTemplate('Patient has visible bleeding from an injury.')"
                class="chip rounded-xl p-3.5 flex flex-col items-center gap-2 text-center">
                <span class="material-symbols-outlined text-red-400 text-3xl">bloodtype</span>
                <span class="text-xs font-semibold text-gray-200">Bleeding / injury</span>
            </button>
            <button type="button" onclick="fillTemplate('Patient is unconscious and not responding.')"
                class="chip rounded-xl p-3.5 flex flex-col items-center gap-2 text-center">
                <span class="material-symbols-outlined text-yellow-400 text-3xl">emergency_heat</span>
                <span class="text-xs font-semibold text-gray-200">Unconscious</span>
            </button>
            <button type="button" onclick="fillTemplate('Patient was involved in an accident with visible trauma.')"
                class="chip rounded-xl p-3.5 flex flex-col items-center gap-2 text-center">
                <span class="material-symbols-outlined text-orange-400 text-3xl">car_crash</span>
                <span class="text-xs font-semibold text-gray-200">Accident / trauma</span>
            </button>
        </div>

        <form action="/result" method="post" class="space-y-5">
            <!-- Text area -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="symptomBox" class="block text-sm font-semibold text-gray-300">Emergency Description</label>
                    <div class="flex items-center gap-2">
                        <!-- Language Select -->
                        <select id="voice-lang" class="bg-gray-900 border border-gray-700 text-white text-xs rounded-lg p-1.5 focus:outline-none cursor-pointer">
                            <option value="en-US">🇬🇧 English</option>
                            <option value="ta-IN">🇮🇳 தமிழ் (Tamil)</option>
                            <option value="hi-IN">🇮🇳 हिंदी (Hindi)</option>
                        </select>
                        <!-- Mic Button -->
                        <button type="button" id="mic-btn" onclick="toggleVoiceInput()" class="w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-750 border border-gray-700 flex items-center justify-center text-gray-300 hover:text-white transition-all relative group" title="Start voice typing">
                            <span class="material-symbols-outlined text-lg">mic</span>
                            <!-- Small pulsing red dot when recording -->
                            <span id="mic-status-dot" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                        </button>
                    </div>
                </div>
                <textarea id="symptomBox" name="symptom_text" rows="4" required
                    class="w-full p-4 rounded-xl bg-gray-900/60 border border-gray-700/80 focus:border-red-500/70 focus:ring-1 focus:ring-red-500/30 text-white placeholder-gray-500 text-sm transition-all focus:outline-none"
                    placeholder="Describe symptoms, age, patient condition, what happened..."></textarea>
                <!-- Voice feedback indicator -->
                <div id="voice-feedback" class="hidden mt-2 text-xs text-red-400 flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="voice-status-text">Listening... speak now.</span>
                </div>
            </div>

            <!-- Disaster mode checkbox -->
            <label class="flex items-start gap-3.5 bg-gray-900/40 border border-gray-800/80 hover:border-gray-700 rounded-xl p-4 cursor-pointer transition-colors">
                <input type="checkbox" name="disaster_mode" value="true" class="w-5 h-5 accent-red-600 rounded mt-0.5">
                <span class="text-sm">
                    <span class="font-bold text-gray-200 block">Disaster Situation</span>
                    <span class="text-gray-400 text-xs">Activate if patient is in a flood, earthquake, or mass-casualty event.</span>
                </span>
            </label>

            <!-- Submit button -->
            <button type="submit" class="w-full bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 active:scale-[0.98] transition-all py-4 rounded-xl text-md font-bold shadow-lg shadow-red-500/10">
                Analyze Condition
            </button>
        </form>
    </div>

    <script>
        let recognition = null;
        let isRecording = false;

        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome or Safari.");
                return;
            }

            const micBtn = document.getElementById("mic-btn");
            const micIcon = micBtn.querySelector(".material-symbols-outlined");
            const statusDot = document.getElementById("mic-status-dot");
            const feedback = document.getElementById("voice-feedback");
            const statusText = document.getElementById("voice-status-text");
            const symptomBox = document.getElementById("symptomBox");
            const voiceLang = document.getElementById("voice-lang").value;

            if (isRecording) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = voiceLang;
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.remove("bg-gray-800", "hover:bg-gray-750");
                micBtn.classList.add("bg-red-500/20", "border-red-500/50", "text-red-400");
                micIcon.innerText = "mic_off";
                statusDot.classList.remove("hidden");
                feedback.classList.remove("hidden");
                const langName = voiceLang === 'ta-IN' ? 'Tamil' : (voiceLang === 'hi-IN' ? 'Hindi' : 'English');
                statusText.innerText = `Listening (${langName})... Speak now.`;
            };

            recognition.onerror = (e) => {
                console.error("Speech recognition error: ", e);
                resetMicUI();
                if (e.error === 'not-allowed') {
                    alert("Microphone permission denied. Please allow microphone access in your browser settings.");
                } else {
                    alert("Voice input failed: " + e.error);
                }
            };

            recognition.onend = () => {
                resetMicUI();
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (transcript) {
                    if (symptomBox.value.trim() === "") {
                        symptomBox.value = transcript;
                    } else {
                        symptomBox.value = symptomBox.value.trim() + " " + transcript;
                    }
                    symptomBox.dispatchEvent(new Event('input'));
                }
            };

            recognition.start();
        }

        function resetMicUI() {
            isRecording = false;
            const micBtn = document.getElementById("mic-btn");
            const micIcon = micBtn.querySelector(".material-symbols-outlined");
            const statusDot = document.getElementById("mic-status-dot");
            const feedback = document.getElementById("voice-feedback");

            micBtn.classList.remove("bg-red-500/20", "border-red-500/50", "text-red-400");
            micBtn.classList.add("bg-gray-800", "hover:bg-gray-750");
            micIcon.innerText = "mic";
            statusDot.classList.add("hidden");
            feedback.classList.add("hidden");
        }

        function fillTemplate(text) {
            document.getElementById('symptomBox').value = text;
            // Clear active styles from all chips
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            // Set active to the clicked chip
            event.currentTarget.classList.add('active');
        }

        function triggerOneTapSOS(event) {
            event.preventDefault();
            const toast = document.getElementById("sos-toast");
            const toastMsg = document.getElementById("sos-toast-msg");

            function showToast(msg, isSuccess=true) {
                toastMsg.innerText = msg;
                toast.classList.remove("hidden", "bg-emerald-950", "border-emerald-500/30", "text-emerald-400", "bg-red-950", "border-red-500/30", "text-red-400");
                if (isSuccess) {
                    toast.classList.add("bg-emerald-950", "border-emerald-500/30", "text-emerald-400", "flex");
                } else {
                    toast.classList.add("bg-red-950", "border-red-500/30", "text-red-400", "flex");
                }
                setTimeout(() => {
                    toast.classList.add("hidden");
                    toast.classList.remove("flex");
                }, 4000);
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const coords = `GPS Coords: Lat ${position.coords.latitude.toFixed(6)}, Lng ${position.coords.longitude.toFixed(6)}`;
                        navigator.clipboard.writeText(coords)
                            .then(() => {
                                showToast("📋 GPS Coords copied! Calling 108...");
                                setTimeout(() => { window.location.href = "tel:108"; }, 1500);
                            })
                            .catch(() => {
                                showToast("Calling 108...", true);
                                window.location.href = "tel:108";
                            });
                    },
                    (error) => {
                        showToast("Location denied. Calling 108...", false);
                        setTimeout(() => { window.location.href = "tel:108"; }, 1200);
                    },
                    { timeout: 5000, enableHighAccuracy: true }
                );
            } else {
                showToast("Calling 108...", true);
                window.location.href = "tel:108";
            }
        }
    </script>
</body>
</html>
