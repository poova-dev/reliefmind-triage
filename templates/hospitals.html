<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Hospitals</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen px-6 py-10">
    <div class="max-w-md mx-auto">
        <h2 class="text-2xl font-bold mb-6">Nearby Hospitals</h2>

        {% for hospital in hospitals %}
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 mb-4">
            <p class="font-bold text-lg">{{ hospital.name }}</p>
            <p class="text-gray-400 text-sm mb-2">{{ hospital.distance }} away · {{ hospital.type }}</p>
            <a href="{{ hospital.maps_link }}" target="_blank"
                class="text-red-400 underline text-sm">Get Directions</a>
        </div>
        {% endfor %}

        <a href="/input" class="text-gray-400 underline block mt-6">← Back</a>
    </div>
</body>
</html>
